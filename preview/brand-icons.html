<!doctype html>

<html lang="de">
<head>
<meta charset="utf-8">
<title>Iconography</title>
<link rel="stylesheet" href="_base.css">
<style>
  .icons {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 12px;
  }
  .icon-tile {
    aspect-ratio: 1 / 1;
    background: #fffdfa;
    border: 1px solid #ecdfce;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #1d1d1d;
  }
  svg { width: 24px; height: 24px; }
  .flag {
    background: #fbe9d4;
    border: 1px solid #e8a35a44;
    border-radius: 12px;
    padding: 8px 12px;
    font-family: var(--font-body);
    font-size: 11px;
    color: #7a4e1f;
    line-height: 1.4;
  }
</style>
</head>
