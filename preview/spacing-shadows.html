<!doctype html>
<!-- @dsCard group="Spacing" name="Shadow System" subtitle="Warm brown undertone — rgba(77,54,30,…)" viewport="700x170" -->
<html lang="de">
<head>
<meta charset="utf-8">
<title>Shadows</title>
<link rel="stylesheet" href="_base.css">
<style>
  body { background: var(--bg); padding: 8px 0 18px; }
  .grid5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; padding: 10px 0 18px; }
  .shade {
    background: #fffdfa;
    border-radius: 16px;
    height: 78px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 10px;
    font-family: var(--font-body);
    font-size: 11px;
    font-weight: 700;
    color: #1d1d1d;
  }
  .tag { font-family: var(--font-body); font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--fg-subtle); text-align: center; margin-top: 8px; }
</style>
</head>
<body>
<div class="card">
  <div class="grid5">
    <div>
      <div class="shade" style="box-shadow: 0 1px 2px rgba(77,54,30,0.06)">xs</div>
      <div class="tag">xs · subtle</div>
    </div>
    <div>
      <div class="shade" style="box-shadow: 0 2px 6px rgba(77,54,30,0.08)">sm</div>
      <div class="tag">sm · resting</div>
    </div>
    <div>
      <div class="shade" style="box-shadow: 0 6px 18px rgba(77,54,30,0.10)">md</div>
      <div class="tag">md · card</div>
    </div>
    <div>
      <div class="shade" style="box-shadow: 0 14px 36px rgba(77,54,30,0.14)">lg</div>
      <div class="tag">lg · float</div>
    </div>
    <div>
      <div class="shade" style="box-shadow: 0 10px 28px rgba(77,54,30,0.16)">hover</div>
      <div class="tag">hover · lift</div>
    </div>
  </div>
  <div class="label" style="text-align:center">Warm brown undertone · rgba(77, 54, 30, …)</div>
</div>
</body>
</html>
