<!doctype html>
<!-- @dsCard group="Spacing" name="Corner Radii" subtitle="6 → pill — never zero-radius" viewport="700x170" -->
<html lang="de">
<head>
<meta charset="utf-8">
<title>Corner Radii</title>
<link rel="stylesheet" href="_base.css">
<style>
  .grid6 { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
  .radius-demo {
    background: var(--brand-yellow);
    height: 86px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 8px;
    font-family: var(--font-body);
    font-size: 11px;
    font-weight: 700;
    color: #1d1d1d;
  }
  .tag { font-family: var(--font-body); font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--fg-subtle); text-align: center; margin-top: 4px; }
</style>
</head>
<body>
<div class="card">
  <div class="grid6">
    <div>
      <div class="radius-demo" style="border-radius:6px">6px</div>
      <div class="tag">xs</div>
    </div>
    <div>
      <div class="radius-demo" style="border-radius:10px">10px</div>
      <div class="tag">sm</div>
    </div>
    <div>
      <div class="radius-demo" style="border-radius:16px">16px</div>
      <div class="tag">md</div>
    </div>
    <div>
      <div class="radius-demo" style="border-radius:24px">24px</div>
      <div class="tag">lg</div>
    </div>
    <div>
      <div class="radius-demo" style="border-radius:32px">32px</div>
      <div class="tag">xl</div>
    </div>
    <div>
      <div class="radius-demo" style="border-radius:999px">pill</div>
      <div class="tag">pill</div>
    </div>
  </div>
  <div class="label" style="text-align:center">Generous & soft — never zero-radius</div>
</div>
</body>
</html>
