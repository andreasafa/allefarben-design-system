<!doctype html>
<!-- @dsCard group="Brand" name="Photography" subtitle="Warm light, authentic queer community, rainbow IN scene" viewport="700x340" -->
<html lang="de">
<head>
<meta charset="utf-8">
<title>Photography Style</title>
<link rel="stylesheet" href="_base.css">
<style>
  .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .shot {
    aspect-ratio: 1 / 1;
    border-radius: 14px;
    overflow: hidden;
    background: #f7ede2;
  }
  .shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
</style>
</head>
<body>
<div class="card">
  <div class="grid">
    <div class="shot"><img src="../assets/img-shopping-help.png" alt=""></div>
    <div class="shot"><img src="../assets/img-coffee-kitchen.png" alt=""></div>
    <div class="shot"><img src="../assets/img-paperwork-help.png" alt=""></div>
    <div class="shot"><img src="../assets/img-kitchen-cleaning.png" alt=""></div>
    <div class="shot"><img src="../assets/img-family-play.png" alt=""></div>
    <div class="shot"><img src="../assets/img-couch-portrait.png" alt=""></div>
  </div>
  <div class="label" style="text-align:center">Warm natural light · queer elders, BIPOC, disability visibility · rainbow accents IN the scene</div>
</div>
</body>
</html>
