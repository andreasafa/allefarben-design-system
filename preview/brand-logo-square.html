<!doctype html>
<!-- @dsCard group="Brand" name="Logo — Variants" subtitle="Square mark on cream / yellow / dark" viewport="700x230" -->
<html lang="de">
<head>
<meta charset="utf-8">
<title>Logo — Square & On Color</title>
<link rel="stylesheet" href="_base.css">
<style>
  .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
  .tile {
    border-radius: 16px;
    padding: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 160px;
  }
  .tile img { max-width: 100%; max-height: 100%; }
  .tile.light { background: #fffdfa; box-shadow: inset 0 0 0 1px #ecdfce; }
  .tile.yellow { background: #ffe28d; }
  .tile.dark { background: #1d1d1d; }
  .tag { font-family: var(--font-body); font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--fg-subtle); text-align: center; margin-top: 6px; }
</style>
</head>
<body>
<div class="card">
  <div class="row3">
    <div><div class="tile light"><img src="../assets/logo-square.png" alt=""></div><div class="tag">On cream</div></div>
    <div><div class="tile yellow"><img src="../assets/logo-square.png" alt=""></div><div class="tag">On primary</div></div>
    <div><div class="tile dark"><img src="../assets/logo-square.png" alt=""></div><div class="tag">On dark (use sparingly)</div></div>
  </div>
</div>
</body>
</html>
