<!doctype html>
<!-- @dsCard group="Components" name="Buttons" subtitle="Primary / Secondary / Ghost + hover & press" viewport="700x180" -->
<html lang="de">
<head>
<meta charset="utf-8">
<title>Buttons</title>
<link rel="stylesheet" href="_base.css">
<style>
  .btn-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .btn {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 15px;
    border: none;
    border-radius: 999px;
    padding: 12px 22px;
    cursor: pointer;
    transition: all 200ms cubic-bezier(0.22, 1, 0.36, 1);
    display: inline-flex;
    align-items: center;
    gap: 8px;
    letter-spacing: 0.005em;
  }
  .btn-primary { background: #ffe28d; color: #1d1d1d; box-shadow: 0 2px 6px rgba(77,54,30,0.08); }
  .btn-primary.hover { background: #fcd66b; box-shadow: 0 10px 28px rgba(77,54,30,0.16); transform: translateY(-1px); }
  .btn-primary.press { background: #f2c856; transform: scale(0.98); }
  .btn-secondary { background: transparent; color: #1d1d1d; border: 1.5px solid #1d1d1d; }
  .btn-ghost { background: #fef3e8; color: #1d1d1d; }
  .btn-sm { font-size: 13px; padding: 8px 16px; }
  .btn-lg { font-size: 17px; padding: 16px 28px; }
  .arr { font-family: var(--font-body); font-weight: 700; }
  .label-inline { font-family: var(--font-body); font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--fg-subtle); align-self: flex-end; margin-bottom: 14px; }
</style>
</head>
<body>
<div class="card">
  <div class="btn-row">
    <button class="btn btn-primary">Termin buchen <span class="arr">→</span></button>
    <button class="btn btn-primary hover">Hover</button>
    <button class="btn btn-primary press">Pressed</button>
  </div>
  <div class="btn-row">
    <button class="btn btn-secondary">Mehr erfahren</button>
    <button class="btn btn-ghost">Kontakt</button>
    <button class="btn btn-primary btn-sm">Klein</button>
    <button class="btn btn-primary btn-lg">Los geht's</button>
  </div>
</div>
</body>
</html>
