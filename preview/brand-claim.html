<!doctype html>
<!-- @dsCard group="Brand" name="Claim" subtitle="„Für alle, die Vielfalt l(i)eben!'" viewport="700x240" -->
<html lang="de">
<head>
<meta charset="utf-8">
<title>Claim</title>
<link rel="stylesheet" href="_base.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap">
<style>
  .block {
    background: #fffdfa;
    border-radius: 20px;
    padding: 36px 28px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .block::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 5px;
    background: var(--gradient-rainbow);
  }
  .eyebrow {
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: #7a736c;
    margin-bottom: 14px;
  }
  .claim {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 38px;
    line-height: 1.1;
    letter-spacing: -0.01em;
    color: #1d1d1d;
  }
  .claim .l { color: #1d1d1d; font-weight: 700; }
  .sub {
    font-family: "Nunito", var(--font-body);
    font-size: 26px;
    color: #1d1d1d;
    margin-top: 10px;
  }
</style>
</head>
<body>
<div class="card">
  <div class="block">
    <div class="eyebrow">Claim</div>
    <div class="claim">Für alle, die Vielfalt <span class="l">l(i)eben</span>!</div>
    <div class="sub">Queere Alltagshilfe in Berlin</div>
  </div>
</div>
</body>
</html>
